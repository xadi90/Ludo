name: Build LUDO Android APK

on:
  push:
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDK_MANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK Signature and Package
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 10

      - name: Publish Direct LUDO.apk (No ZIP) to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LUDO.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "LUDO Latest APK" --notes "Direct installable Android APK (no zip extraction required). Commit: ${{ github.sha }}"
            gh release upload latest LUDO.apk --clobber
          else
            gh release create latest LUDO.apk --title "LUDO Latest APK" --notes "Direct installable Android APK (no zip extraction required)."
          fi
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/LUDO.apk"
          {
            echo "## LUDO Direct APK Download (No ZIP)"
            echo ""
            echo "- **Download Direct APK:** [$APK_URL]($APK_URL)"
            echo "- GitHub Releases serves **LUDO.apk** directly as an installable Android package without any \`.zip\` wrapper."
          } >> "$GITHUB_STEP_SUMMARY"
